[package]
name = "altopelago-aes-telex"
version = "0.2.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
description = "Telex codec and portable AES validation for AltoPelago"
repository = "https://github.com/AltoPelago/aes"
documentation = "https://docs.rs/altopelago-aes-telex"
readme = "README.md"
keywords = ["aes", "telex", "serialization", "validation"]
categories = ["encoding", "parser-implementations"]
publish = ["crates-io"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
sha2 = "0.11.0"

[features]
pipeline-dhat = []

[lib]
name = "aes_telex"
path = "src/lib.rs"

[dev-dependencies]
dhat = "0.3.3"
serde_json = "1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
