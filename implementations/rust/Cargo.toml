[package]
name = "aes-telex"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
description = "Dependency-free Rust reference implementation of telex.aes"
publish = false

[dependencies]
sha2 = "0.11.0"

[features]
pipeline-dhat = []

[lib]
path = "src/lib.rs"

[dev-dependencies]
dhat = "0.3.3"
serde_json = "1.0.150"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
