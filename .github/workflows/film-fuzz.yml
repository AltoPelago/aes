name: Film Fuzz

on:
  schedule:
    - cron: '23 17 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-fuzz
  cancel-in-progress: false

jobs:
  rust-film-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-04-14

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version =0.13.1 --locked

      - name: Seed Film corpus from mutable CTS
        run: npm run seed:fuzz:film

      - name: Fuzz borrowed and validated Rust decoders
        run: >-
          cargo +nightly-2026-04-14 fuzz run
          --fuzz-dir implementations/rust/fuzz
          film_decode implementations/rust/fuzz/corpus/film_decode
          -- -max_total_time=300 -max_len=4096
