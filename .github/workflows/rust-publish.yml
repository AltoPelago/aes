name: Rust Publish

on:
  push:
    tags:
      - "aes-telex/v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package crate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require signed annotated release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          git cat-file tag "${GITHUB_REF_NAME}" | grep -Eq '^-+BEGIN (PGP|SSH) SIGNATURE-+$'

      - name: Verify tag commit is on main
        if: ${{ github.event_name == 'push' }}
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Verify release tag is signed
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(printf '%s' "$tag_ref" | jq -r '.object.type')"
          tag_sha="$(printf '%s' "$tag_ref" | jq -r '.object.sha')"
          test "$tag_type" = "tag"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified' | grep -qx true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Match tag to crate version
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 --manifest-path implementations/rust/Cargo.toml | jq -r '.packages[] | select(.name == "altopelago-aes-telex") | .version')"
          test "${GITHUB_REF_NAME}" = "aes-telex/v${VERSION}"

      - name: Rust formatting
        run: cargo fmt --check --manifest-path implementations/rust/Cargo.toml

      - name: Rust lint
        run: cargo clippy --locked --all-targets --all-features --manifest-path implementations/rust/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path implementations/rust/Cargo.toml

      - name: Package crate
        run: cargo package --locked --manifest-path implementations/rust/Cargo.toml

  publish:
    name: Publish crates.io package
    if: ${{ github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/altopelago-aes-telex
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@d6b091a10d7f9b30e4c05478289e94fb309882c5 # main

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --manifest-path implementations/rust/Cargo.toml

  published-smoke:
    name: Clean crates.io consumer
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1

      - name: Install and exercise exact published version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#aes-telex/v}"
          cargo new --bin aes-telex-registry-smoke
          cd aes-telex-registry-smoke
          cat >> Cargo.toml <<EOF
          altopelago-aes-telex = "=${VERSION}"
          EOF
          cat > src/main.rs <<'EOF'
          use aes_telex::film::{
              FilmLimits, FilmStream, decode_film_with_limits, encode_film_with_limits,
          };
          use aes_telex::{AES_EVENT_CONTRACT, TELEX_VERSION, TelexLimits, parse_telex};

          fn typed_stream(datatype: &str) -> FilmStream {
              let parsed = parse_telex(&format!(
                  "telex.aes=1\nprofile=aes.partial.v1\n\npath=$.item\nkind=NumberLiteral\ndatatype={datatype}\nvalue=1\n\n",
              ))
              .expect("published crate should parse datatype metadata");
              FilmStream {
                  profile: parsed.profile,
                  profile_explicit: parsed.profile_explicit,
                  projection: parsed.projection,
                  projection_explicit: parsed.projection_explicit,
                  records: parsed.records,
              }
          }

          fn main() {
              assert_eq!(TELEX_VERSION, "1");
              assert_eq!(AES_EVENT_CONTRACT, "aes.events.v1");
              let parsed = parse_telex(
                  "telex.aes=1\n\npath=$.message\nkind=StringLiteral\nvalue=Hello\\n\n",
              )
              .expect("published crate should parse canonical Telex");
              assert_eq!(parsed.records.len(), 1);

              let film_limits = FilmLimits::default();
              let depth_zero = TelexLimits {
                  max_generic_depth: 0,
                  ..TelexLimits::default()
              };
              for datatype in ["list<int>", "list<custom[2]>"] {
                  let stream = typed_stream(datatype);
                  let bytes = encode_film_with_limits(&stream, &[], &film_limits, &depth_zero)
                      .expect("leaf generic must encode at logical depth zero");
                  let decoded = decode_film_with_limits(&bytes, &[], &film_limits, &depth_zero)
                      .expect("leaf generic must decode at logical depth zero");
                  assert_eq!(decoded, stream);
              }

              let nested = typed_stream("list<list<int>>");
              assert!(encode_film_with_limits(&nested, &[], &film_limits, &depth_zero).is_err());
              let bytes = encode_film_with_limits(
                  &nested, &[], &film_limits, &TelexLimits::default(),
              )
              .expect("nested generics must encode with the default limit");
              let error = decode_film_with_limits(&bytes, &[], &film_limits, &depth_zero)
                  .expect_err("logical depth one must be rejected at a maximum of zero");
              assert_eq!(error.code, "FILM_AES_INVALID");
              assert_eq!(error.diagnostics.len(), 1);
              let diagnostic = &error.diagnostics[0];
              assert_eq!(diagnostic.code, "AES_LIMIT_EXCEEDED");
              assert_eq!(diagnostic.counter, Some("max_generic_depth"));
              assert_eq!(diagnostic.observed, Some(1));
              assert_eq!(diagnostic.limit, Some(0));
          }
          EOF
          for attempt in $(seq 1 12); do
            if cargo fetch; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          cargo run --release
